# Local development stack. Every value has a development default so that
# `docker compose up` works on a clean clone; override them in .env.
# These defaults are for local use only and must never reach production.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-lumio}:${POSTGRES_PASSWORD:-lumio}@postgres:5432/${POSTGRES_DB:-lumio}?schema=public
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumio}
      POSTGRES_DB: ${POSTGRES_DB:-lumio}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumio} -d ${POSTGRES_DB:-lumio}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${SMTP_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-development-only-cookie-secret-0123456789}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local-development-only-access-token-secret-01234}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1rZXktMDAwMDA=}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Lumio <no-reply@lumio.local>}
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
