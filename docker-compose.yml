# Local development stack. Ports, names and the database password have
# development defaults; override them in .env. Secrets have none: they come
# from .env (`npm run env:init` writes one with fresh random values), so the
# stack never runs on a value that is published in this repository.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-lumio}:${POSTGRES_PASSWORD:-lumio}@postgres:5432/${POSTGRES_DB:-lumio}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?run npm run env:init, or set REDIS_PASSWORD in .env}@redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumio}
      POSTGRES_DB: ${POSTGRES_DB:-lumio}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumio} -d ${POSTGRES_DB:-lumio}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Sessions, rate limits and the job queue live here, so it asks for a password
    # even though the port is only published on localhost.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?run npm run env:init, or set REDIS_PASSWORD in .env}',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run npm run env:init, or set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${SMTP_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      API_PORT: 4000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      COOKIE_SECRET: ${COOKIE_SECRET:?run npm run env:init, or set COOKIE_SECRET in .env}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?run npm run env:init, or set ACCESS_TOKEN_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run npm run env:init, or set ENCRYPTION_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Lumio <no-reply@lumio.local>}
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
